<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human in the Loop — UiPath Mobile Test Autopilot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=Fira+Code:wght@300;400;500&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#050A14; --bg2:#0A1024;
    --accent:#FA4616; --accent-l:#FF7A4F;
    --blue:#3B82F6; --blue-l:#60A5FA; --cyan:#06B6D4;
    --green:#10B981; --green-l:#34D399; --amber:#F59E0B;
    --t1:#F0F4F8; --t2:#94A3B8; --t3:#64748B; --t4:#1E293B;
    --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.10);
    --display:'Outfit',-apple-system,system-ui,sans-serif;
    --mono:'Fira Code',ui-monospace,Menlo,monospace;
  }
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--display)}
  canvas#fx{position:fixed;inset:0;z-index:0}
  .vig{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 72% 66% at 50% 48%,transparent 0%,var(--bg) 100%)}
  /* header */
  .header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;
    justify-content:space-between;padding:22px 34px;opacity:0;transform:translateY(-8px);
    transition:opacity .8s ease,transform .8s ease}
  .header.in{opacity:1;transform:none}
  .logo-row{display:flex;align-items:center;gap:11px}
  .logo-row svg{height:26px;width:auto;opacity:.82}
  .logo-row .sep{width:1px;height:14px;background:rgba(255,255,255,.12)}
  .logo-row .label{font-size:11px;color:var(--t2);font-weight:500;letter-spacing:.6px}
  .badge{font-family:var(--mono);font-size:9px;color:var(--t3);letter-spacing:1.6px;
    text-transform:uppercase;padding:5px 13px;border-radius:20px;border:1px solid var(--border);
    background:rgba(255,255,255,.02)}
  /* footer */
  .footer{position:fixed;bottom:26px;left:0;right:0;z-index:10;display:flex;align-items:center;
    justify-content:center;gap:16px;opacity:0;transform:translateY(8px);
    transition:opacity .8s ease .15s,transform .8s ease .15s}
  .footer.in{opacity:1;transform:none}
  .footer .fl{width:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent)}
  .footer svg{height:24px;width:auto;opacity:.5}
  .footer .ft{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--t3);font-weight:400}
  /* stage + shared reveal */
  .stage{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:90px 40px}
  .reveal{opacity:0;transform:translateY(20px);
    transition:opacity .75s cubic-bezier(.22,1,.36,1),transform .75s cubic-bezier(.22,1,.36,1);
    transition-delay:var(--d,0s)}
  .stage.go .reveal{opacity:1;transform:none}
  .kick{font-family:var(--mono);font-size:12px;letter-spacing:5px;text-transform:uppercase;
    color:var(--t3);font-weight:400}
  .cp{transform:scale(1.04)}
  .accent{color:var(--accent)}
  
.s9{width:560px;text-align:center}
.s9 .kick{margin-bottom:26px}
.rcard{border:1px solid var(--border2);border-radius:14px;background:rgba(255,255,255,.02);padding:20px 22px;text-align:left}
.rrow{display:flex;align-items:center;gap:14px}
.rrow .lbl{font-size:12px;color:var(--t3);width:46px}
.editf{flex:1;font-family:var(--mono);font-size:14px;color:var(--t1);background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:8px;padding:10px 12px;position:relative;transition:border-color .3s}
.editf.edit{border-color:var(--accent)}
.editf .car{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:1px;opacity:0}
.editf.edit .car{opacity:1;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.status{margin-top:16px;display:flex;align-items:center;gap:10px}
.chip9{font-family:var(--mono);font-size:12px;border-radius:20px;padding:5px 13px;transition:all .5s}
.chip9.att{color:var(--amber);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.28)}
.chip9.pass{color:var(--green);background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.32)}
.exp{margin-top:28px;display:flex;gap:10px;justify-content:center;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.exp.show{opacity:1;transform:none}
.eb{font-family:var(--mono);font-size:12px;color:var(--t2);border:1px solid var(--border);border-radius:9px;padding:9px 15px;background:rgba(255,255,255,.02)}
.eb.hot{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--accent),#e63d12);box-shadow:0 10px 28px rgba(250,70,22,.35)}

</style>
</head>

<script>
// ── particle field ──
const C=document.getElementById('fx'),X=C.getContext('2d');let W,H;
function rez(){W=C.width=innerWidth;H=C.height=innerHeight}rez();addEventListener('resize',rez);
const pts=Array.from({length:48},()=>{const warm=Math.random()>.5;return{
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*(warm?1.4:.8)+.3,
  vx:(Math.random()-.5)*.11,vy:(Math.random()-.5)*.11-.03,baseA:Math.random()*.07+.015,
  hue:warm?16+Math.random()*10:215+Math.random()*18,sat:warm?'82%':'45%',lit:warm?'56%':'52%',
  pulse:Math.random()*6.28,pSpd:.3+Math.random()*.6}});
function drawBG(t){X.clearRect(0,0,W,H);const s=t/1000;
  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;
    if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5;
    const a=p.baseA*(.5+Math.sin(s*p.pSpd+p.pulse)*.35);
    X.beginPath();X.arc(p.x,p.y,p.r,0,6.2832);X.fillStyle=`hsla(${p.hue},${p.sat},${p.lit},${a})`;X.fill();
    if(p.r>1){X.beginPath();X.arc(p.x,p.y,p.r*3.5,0,6.2832);
      const g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.5);
      g.addColorStop(0,`hsla(${p.hue},${p.sat},${p.lit},${a*.2})`);g.addColorStop(1,`hsla(${p.hue},${p.sat},${p.lit},0)`);
      X.fillStyle=g;X.fill();}});
  const breath=Math.sin(s*.35)*.12+.88,r=Math.min(W,H)*.42*breath;
  const cg=X.createRadialGradient(W/2,H*.52,0,W/2,H*.52,r);
  cg.addColorStop(0,'rgba(250,70,22,.05)');cg.addColorStop(.5,'rgba(250,70,22,.016)');cg.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=cg;X.fillRect(0,0,W,H);requestAnimationFrame(drawBG);}
requestAnimationFrame(drawBG);
// ── helpers ──
const cl=t=>Math.max(0,Math.min(1,t)),lr=(a,b,t)=>a+(b-a)*t;
const eOC=t=>1-Math.pow(1-t,3),eOQ=t=>1-Math.pow(1-t,4);
function animNum(el,from,to,suf,dur,delay){const t0=performance.now();(function tick(){
  const p=cl((performance.now()-t0-(delay||0))/dur);if(p<=0){requestAnimationFrame(tick);return}
  el.textContent=Math.round(lr(from,to,eOC(p)))+(suf||'');if(p<1)requestAnimationFrame(tick);})();}
function typeOut(el,text,speed,delay,done){el.textContent='';let i=0;
  setTimeout(function step(){if(i<=text.length){el.textContent=text.slice(0,i);i++;setTimeout(step,speed)}else if(done)done()},delay||0);}
const $=id=>document.getElementById(id);
let playScene=null;
